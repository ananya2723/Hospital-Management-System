name: Quality Gate

on:
  push:
  pull_request:

jobs:
  node-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/hms-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/hms-web/package-lock.json
      - run: npm ci
      - run: npm run build
